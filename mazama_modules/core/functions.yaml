  - {area: names, name: parse, rust: "names::parse_json", what: "{items: [{text, kind, license}], aliases, formats} -> [{status, strain_raw, strain, dose, dose_text, code, expiry, label, note}] a product's or batch/lot's name read into fields (ok, partial or unparsed, and why)"}
  - {area: names, name: strains, rust: "names::strains_json", what: "{texts, aliases} -> [{key, spelled, clean, canonical}] a strain's key, its spelling fixed, its safe form and the name it is shown as"}
  - {area: names, name: code_of, rust: "names::code_of_json", what: "{items: [{description, coa_code}]} -> [code] a product's type code: the one after TPE in its name, else the certificate's, else a word in the name"}
