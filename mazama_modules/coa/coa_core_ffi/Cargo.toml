[package]
name = "coa_core_ffi"
version = "0.1.0"
edition = "2024"
description = "C interface over JSON to coa_core, for the phone app (dart:ffi). specs/coa/08-phone-label-debug.md"

[lib]
# cdylib: Android's libcoa_core_ffi.so (and Linux, for the Dart tests); staticlib: iOS, linked into the app itself
# (mazama_mobile/ios/build_coa_core_ffi.sh); rlib: the crate's own tests
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
coa_core = { path = "../coa_core" }
serde_json = "1.0.154"

[profile.release]
panic = "unwind"
