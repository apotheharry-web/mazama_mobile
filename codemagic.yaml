# Release builds of the Mazama service-center app, made by Codemagic from this public repository.
#
# A release is a tag v<version> where <version> is mazama_mobile/pubspec.yaml's `version:` exactly (e.g. v0.2.2+31).
# Pushing it builds that commit twice:
#   - ios-release: signed for the App Store and uploaded to App Store Connect (TestFlight, then App Review by hand);
#   - android-release: signed with the owner's upload key and attached, with its SHA-256, to the GitHub release of the tag,
#     with a draft, unsigned latest.json (the release file phones are offered, specs/app-updates AU-R19). Phones and
#     Mazama's server read only the signed copy at this repository's root: the owner checks the draft's sha256 against
#     the .sha256 asset and the Codemagic log's commit against the tag, signs it on the server
#     (`sudo mazama-sales sign latest.json`, which prints what it signs) and commits latest.json and latest.json.sig at
#     the root (owner step O2). Codemagic never holds the signing key.
# Both refuse a tag that isn't the pubspec version and a build without the app key. Build numbers come from the
# pubspec (the "+31"), so they only go up whichever service builds.
#
# Set up once in Codemagic (none of these values is in this repository):
#   - environment variable group mazama_app_key: APP_API_KEY (secret), the key the app sends to Mazama's server;
#   - environment variable group github_release: GITHUB_TOKEN (secret), a token that may create releases here;
#   - code signing identities: the Android keystore "codemagic"; the iOS profiles mazama-mobile and mazama-widget and
#     the certificate "mazama Apple Distribution"; the App Store Connect integration "admin key".

definitions:
  triggering: &release_tags
    events:
      - tag
    tag_patterns:
      - pattern: 'v*'
        include: true
  check_release: &check_release
    name: Check the tag and the app key
    script: |
      want="v$(grep '^version:' pubspec.yaml | awk '{print $2}')"
      if [ "${CM_TAG:-}" != "$want" ]; then
        echo "error: the tag is '${CM_TAG:-}' but pubspec.yaml makes this $want; tag the release $want"; exit 1
      fi
      if [ -z "${APP_API_KEY:-}" ]; then
        echo "error: APP_API_KEY is empty: add it to the mazama_app_key group (the app's Environment variables tab)"; exit 1
      fi
      echo "release $want, app key set (${#APP_API_KEY} characters)"
  icons: &icons
    name: Generate app icons
    script: dart run flutter_launcher_icons

workflows:
  ios-release:
    name: iOS release (App Store Connect)
    working_directory: mazama_mobile
    triggering: *release_tags
    integrations:
      app_store_connect: admin key
    environment:
      flutter: stable
      groups:
        - mazama_app_key
      ios_signing:
        provisioning_profiles:
          - mazama-mobile
          - mazama-widget
        certificates:
          - mazama Apple Distribution
    scripts:
      - *check_release
      - name: Get Flutter packages
        script: flutter pub get
      - *icons
      - name: Install Rust for the shared core
        # ios/build_mazama_core_ffi.sh (an Xcode build phase) compiles ../mazama_modules/core/mazama_core_ffi into the app
        script: |
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc --version
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --dart-define=APP_API_KEY="$APP_API_KEY" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Check the shared core is in the app
        script: |
          bin=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Runner
          syms=$(nm -gU "$bin")
          list=../mazama_modules/core/ios_symbols.txt
          [ -s "$list" ] || { echo "error: $list is missing or empty"; exit 1; }
          n=0
          for f in $(cat "$list"); do
            echo "$syms" | grep -q " _${f}\$" || { echo "error: _${f} is missing from $bin"; exit 1; }
            n=$((n+1))
          done
          [ "$n" -ge 1 ] || { echo "error: $list names no symbol"; exit 1; }
          echo "mazama_core: all functions present in the app"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  android-release:
    name: Android release (GitHub release)
    # no instance_type: Codemagic's default Mac (mac_mini_m2), the one machine the free plan offers; Linux machines
    # need a paid plan
    working_directory: mazama_mobile
    triggering: *release_tags
    environment:
      flutter: stable
      android_signing:
        - codemagic      # exports CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD (build.gradle.kts)
      groups:
        - mazama_app_key
        - github_release
    scripts:
      - *check_release
      - name: Check the build number
        # AU-R1: the build is YYMMDDNN, a real date at most tomorrow (UTC), so a release file can't name a far-future build
        script: |
          build="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f2)"
          echo "$build" | grep -Eq '^[0-9]{8}$' || { echo "error: the build '$build' is not YYMMDDNN"; exit 1; }
          day="20${build:0:2}-${build:2:2}-${build:4:2}"
          parsed="$(date -u -j -f '%Y-%m-%d' "$day" '+%Y-%m-%d' 2>/dev/null || true)"   # macOS date
          [ "$parsed" = "$day" ] || { echo "error: $day is not a date"; exit 1; }
          tomorrow="$(date -u -v+1d '+%Y-%m-%d')"
          if [[ "$day" > "$tomorrow" ]]; then echo "error: the build is dated $day, after tomorrow ($tomorrow)"; exit 1; fi
          echo "build $build, dated $day"
      - name: Get Flutter packages
        script: flutter pub get
      - *icons
      - name: Install Rust for the shared core
        # android/app/build.gradle.kts compiles ../mazama_modules/core/mazama_core_ffi for both ABIs with the NDK
        script: |
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version
      - name: Check the signing key
        # android_signing above gives these four only when Team settings > codemagic.yaml settings > Code signing
        # identities > Android keystores holds a keystore whose reference name is exactly "codemagic". Names only, no values.
        script: |
          missing=""
          for v in CM_KEYSTORE_PATH CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            if [ -n "$(printenv "$v")" ]; then echo "$v is set"; else missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "error: not set:$missing. Upload the keystore under Team settings > codemagic.yaml settings > Code signing identities > Android keystores with the reference name \"codemagic\""; exit 1
          fi
          [ -f "$CM_KEYSTORE_PATH" ] || { echo "error: CM_KEYSTORE_PATH points at no file"; exit 1; }
          echo "keystore: $(basename "$CM_KEYSTORE_PATH"), alias $CM_KEY_ALIAS"
      - name: Build signed APK
        script: |
          unset MAZAMA_DEV_RELEASE
          export PATH="$HOME/.cargo/bin:$PATH"
          flutter build apk --release --dart-define=APP_API_KEY="$APP_API_KEY"
      - name: Check the shared core is in the app
        script: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          for abi in arm64-v8a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libmazama_core_ffi.so" || { echo "error: lib/$abi/libmazama_core_ffi.so is missing from $apk"; exit 1; }
          done
          echo "mazama_core: present for arm64-v8a and x86_64"
      - name: Publish the GitHub release
        script: |
          name="mazama_mobile-${CM_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/$name"
          (cd build && shasum -a 256 "$name" > "$name.sha256")   # macOS has shasum, not sha256sum
          gh release create "$CM_TAG" "build/$name" "build/$name.sha256" \
            --title "Mazama service-center app $CM_TAG" \
            --notes "Built by Codemagic from commit ${CM_COMMIT} of this repository. SHA-256: $(cut -d' ' -f1 "build/$name.sha256")"
      - name: Attach the draft release file (unsigned)
        # AU-R19: latest.json's keys in AU-R1's order; the owner signs it and commits it at the repository root (O2)
        script: |
          name="mazama_mobile-${CM_TAG}.apk"
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          build="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f2)"
          apk_url="$(gh api "repos/$CM_REPO_SLUG/releases/tags/$CM_TAG" --jq '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')"
          [ -n "$apk_url" ] || { echo "error: the release has no .apk asset"; exit 1; }
          sha="$(cut -d' ' -f1 "build/$name.sha256")"
          size="$(stat -f%z "build/$name")"                        # macOS stat
          # aapt2 lives under ANDROID_SDK_ROOT or ANDROID_HOME depending on the machine; badging names the minimum
          # SDK "sdkVersion:'NN'" (older build-tools) or "minSdkVersion:'NN'" (newer), not always at the line start
          aapt2=""
          for sdk in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" "$HOME/Library/Android/sdk"; do
            [ -n "$sdk" ] || continue
            found="$(ls "$sdk"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
            [ -n "$found" ] && { aapt2="$found"; break; }
          done
          [ -n "$aapt2" ] || { echo "error: no aapt2 under ANDROID_SDK_ROOT, ANDROID_HOME or ~/Library/Android/sdk"; exit 1; }
          badging="$("$aapt2" dump badging "build/$name" 2>&1)" || { echo "error: $aapt2 dump badging failed:"; echo "$badging" | head -20; exit 1; }
          min_sdk="$(printf '%s\n' "$badging" | grep -oE "(^|[^A-Za-z])(minSdkVersion|sdkVersion):'[0-9]+'" | head -1 | grep -oE "[0-9]+'" | tr -d "'")"
          [ -n "$min_sdk" ] || { echo "error: $aapt2 named no minimum SDK; its first lines:"; echo "$badging" | head -20; exit 1; }
          echo "minSdk $min_sdk (from $aapt2)"
          jq -n --arg version "$version" --argjson build "$build" --arg apk "$apk_url" --arg sha256 "$sha" \
            --argjson size "$size" --argjson minSdk "$min_sdk" \
            '{kind: "mazama-mobile-release", version: $version, build: $build, apk: $apk, sha256: $sha256, size: $size, minSdk: $minSdk}' \
            > build/latest.json
          cat build/latest.json
          gh release upload "$CM_TAG" build/latest.json
    artifacts:
      - build/mazama_mobile-*.apk
      - build/mazama_mobile-*.apk.sha256
      - build/latest.json
